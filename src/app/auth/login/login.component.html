<div class="auth-container">
  <div class="auth-card glass">
    <div class="brand">
      <div class="logo-box">V+</div>
      <h1>VLS PLUS</h1>
      <p class="subtitle">ULTRA AUDIO PLAYER</p>
    </div>

    <form (submit)="onLogin(); $event.preventDefault()">
      <div class="form-group">
        <label>E-mail</label>
        <div class="input-wrapper">
          <span class="icon">📧</span>
          <input type="email" name="email" [(ngModel)]="email" placeholder="seu@email.com" required>
        </div>
      </div>

      <div class="form-group">
        <label>Senha</label>
        <div class="input-wrapper">
          <span class="icon">🔒</span>
          <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" placeholder="••••••••" required>
          <button type="button" class="btn-toggle-pass" (click)="showPassword = !showPassword">
            <svg *ngIf="!showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg *ngIf="showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
      </div>

      <div class="auth-options">
        <label class="remember-me">
          <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe">
          <span class="checkmark"></span>
          Lembrar-me
        </label>
        <a href="#" class="forgot-pass" (click)="$event.preventDefault()">Esqueci a senha</a>
      </div>

      <div class="error-msg" *ngIf="error">{{ error }}</div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'ENTRANDO...' : 'ENTRAR NO PLAYER' }}
      </button>
    </form>

    <div class="footer-links">
      <p>Não tem uma conta? <a routerLink="/register">Cadastre-se</a></p>
    </div>
  </div>

  <div class="bg-blobs">
    <div class="blob red"></div>
    <div class="blob purple"></div>
  </div>
</div>
