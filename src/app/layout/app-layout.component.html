<div class="app-layout">
  <!-- Header -->
  <header class="app-header glassmorphism-header">
    <div class="header-content">
      <div class="logo-container">
        <img src="assets/logo.png" class="app-logo-img" alt="VLS PLUS">
        <h1 class="app-title">VLS PLUS • ULTRA</h1>
      </div>
      <!-- Profile/Auth Action -->
      <div class="header-actions">
        <button class="btn-icon profile-btn" routerLink="/settings">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="app-main">
    <router-outlet></router-outlet>
    
    <div class="persistent-player-bar glassmorphism" *ngIf="!isHome() && (audioService.currentTracks().length ?? 0) > 0">
      <div class="player-info-mini" routerLink="/home">
         <div class="mini-art">
           <img [src]="audioService.currentTrackArt()" *ngIf="audioService.currentTrackArt()" class="mini-img">
           <svg *ngIf="!audioService.currentTrackArt()" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
         </div>
         <div class="mini-text">
           <span class="mini-name-scroller">{{ audioService.currentTracks()[audioService.currentTrackIndex()]?.name || 'VLS PLUS' }}</span>
           <span class="mini-status">{{ audioService.isPlaying() ? 'Tocando' : 'Pausado' }}</span>
         </div>
      </div>
      <div class="player-controls-mini">
         <button class="btn-icon-mini" (click)="audioService.togglePlayPause()">
           <svg *ngIf="!audioService.isPlaying()" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
           <svg *ngIf="audioService.isPlaying()" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
         </button>
      </div>
    </div>
  </main>

  <!-- Bottom Navigation Bar (Mobile-first) -->
  <nav class="app-footer glassmorphism">
    <ul class="footer-menu">
      <li class="footer-item">
        <a routerLink="/home" routerLinkActive="active" class="footer-link touch-target">
          <span class="footer-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          </span>
          <span class="footer-label">Início</span>
        </a>
      </li>
      <li class="footer-item">
        <a routerLink="/browse" routerLinkActive="active" class="footer-link touch-target">
          <span class="footer-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </span>
          <span class="footer-label">Explorar</span>
        </a>
      </li>
      <li class="footer-item">
        <a routerLink="/library" routerLinkActive="active" class="footer-link touch-target">
          <span class="footer-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          </span>
          <span class="footer-label">Biblioteca</span>
        </a>
      </li>
      <li class="footer-item">
        <a routerLink="/settings" routerLinkActive="active" class="footer-link touch-target">
          <span class="footer-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </span>
          <span class="footer-label">Perfil</span>
        </a>
      </li>
    </ul>
  </nav>
</div>
